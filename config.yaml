# AI Mega App — checked-in defaults (the ONE hand-edited config, plus .env
# for secrets). The Settings UI writes settings.local.yaml as an overlay on
# top of this file (Phase 2+); nothing here should be hand-edited at runtime
# by the app itself. See PLAN.md §3.1, §4.1 and docs/FEATURES.md A1.

server:
  host: "0.0.0.0"
  port: 8000

llama_swap:
  base_url: "http://127.0.0.1:8080/v1"
  timeout_s: 120

db:
  path: "data/app.db"

# Locked roster (docs/PHASE0_FINDINGS_SUMMARY.md §1, PLAN.md §4.1). Every
# model/provider name lives here and only here — never as a Python literal.
# gpu: 0 | 1 | "cpu" — placement mechanism is always CUDA_VISIBLE_DEVICES,
# never --tensor-split (measured ~3x slower, PLAN.md §4.1).
# file: absolute path to GGUF on the box (/home/john/llm-stack/models/gguf/).
# resident: true = ttl 0, stays loaded; false = swapped on demand.
models:
  - name: chat-default
    class: general
    ctx: 32768
    gpu: 0
    tool_call: native
    thinking: false
    # Qwen3.6 is hybrid-reasoning and self-triggers a full internal <think>
    # block even with thinking:false at the request layer -- only
    # llama-server's own --reasoning off flag reliably suppresses it (see
    # the frozen rule in CLAUDE.md). Live trace 2026-08-15 (c132ba62) showed
    # 851 completion tokens for a one-line reply, ~100s wall time, almost
    # entirely invisible reasoning.
    reasoning_off: true
    max_tokens: 4096
    enabled: true
    file: "/home/john/llm-stack/models/gguf/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: true
    ttl_s: 0
    extra_flags: []
  - name: reasoner
    # Same blob as chat-default, thinking enabled at the request layer —
    # not a separate swap entry (PLAN.md §4.1).
    class: reasoning
    ctx: 32768
    gpu: 0
    tool_call: native
    thinking: true
    reasoning_off: false
    max_tokens: 8192
    enabled: true
    file: "/home/john/llm-stack/models/gguf/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: false
    ttl_s: null
    extra_flags: []
  - name: reasoner-alt
    class: reasoning
    ctx: 8192
    gpu: 0
    tool_call: weak
    thinking: true
    reasoning_off: false
    max_tokens: 8192
    enabled: false
    file: "/home/john/llm-stack/models/gguf/deepseek-r1-32b.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: false
    ttl_s: null
    extra_flags: []
  - name: coder
    class: coding
    ctx: 16384
    gpu: 0
    tool_call: native
    thinking: false
    reasoning_off: false
    max_tokens: 4096
    enabled: true
    file: "/home/john/llm-stack/models/gguf/Qwen3-Coder-30B-A3B-Instruct-Q5_K_M.gguf"
    quant: Q5_K_M
    mmproj: null
    resident: false
    ttl_s: null
    extra_flags: []
  - name: coder-small
    class: coding
    ctx: 8192
    gpu: 0
    tool_call: weak
    thinking: false
    reasoning_off: false
    max_tokens: 2048
    enabled: true
    file: "/home/john/llm-stack/models/gguf/qwen2.5-coder-7b.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: false
    ttl_s: null
    extra_flags: []
  - name: vision
    class: vision
    ctx: 8192
    gpu: 0
    tool_call: none
    thinking: false
    reasoning_off: false
    max_tokens: 2048
    enabled: true
    file: "/home/john/llm-stack/models/gguf/Qwen3-VL-32B-Instruct-Q4_K_M.gguf"
    quant: Q4_K_M
    mmproj: "/home/john/llm-stack/models/gguf/Qwen3-VL-32B-Instruct-mmproj-BF16.gguf"
    resident: false
    ttl_s: null
    extra_flags: []
  - name: dispatcher
    class: dispatcher
    ctx: 4096
    gpu: 1
    tool_call: native
    thinking: false
    reasoning_off: false
    max_tokens: 256
    enabled: true
    file: "/home/john/llm-stack/models/gguf/Hammer2.1-1.5b-Q4_K_M.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: true
    ttl_s: 0
    extra_flags: []
  - name: utility-gpu
    # Same model as `utility`, placed on GPU1 (3070) resident (ttl:0,
    # always loaded) alongside dispatcher -- always-warm summaries, no swap
    # latency, matching how dispatcher/utility/embed/classifier are already
    # always-warm. This requires coder-small to live on GPU0 (its default
    # placement in this file), not GPU1: measured live on ailab 2026-08-15
    # (nvidia-smi, 8192 MiB 3070) -- dispatcher loaded alone = 1303 MiB,
    # + utility-gpu loaded (ctx 16384, mid-generation) = 7253 MiB total,
    # leaving only ~590 MiB free. coder-small loaded alongside dispatcher
    # would need another ~3650 MiB (4951 MiB total measured for that pair)
    # -- doesn't fit with utility-gpu too (1303+5950+3650 = ~10900 MiB >
    # 8192 MiB card). Phase 0 tested *permanent* co-residency of utility+
    # embed alongside dispatcher on GPU1 and rejected it for compute
    # contention degrading dispatcher 5-7x (phase0-measurements.md §8) --
    # that was concurrent generation load from two always-busy models
    # (summary + embed both fired constantly); a summarizer that's merely
    # loaded-and-idle between the rare token-pressure-triggered runs doesn't
    # reproduce that contention, only VRAM residency does, which fits here.
    class: utility
    ctx: 16384
    gpu: 1
    tool_call: none
    thinking: false
    reasoning_off: true
    max_tokens: 512
    enabled: true
    file: "/home/john/llm-stack/models/gguf/qwen3-8b.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: true
    ttl_s: 0
    extra_flags: []
  - name: utility
    class: utility
    ctx: 8192
    gpu: cpu
    tool_call: none
    thinking: false
    reasoning_off: true
    # Was 1024. Measured live 2026-08-15 (docs/HANDOFF.md): CPU decode is
    # ~5 tok/s, so 1024 output tokens alone costs ~205s -- with
    # background.summary_timeout_s at 180s that leaves a *negative* input
    # budget (_time_budget_tokens in summaries.py), meaning the CPU path
    # could never actually summarize anything. 512 leaves real room for
    # input tokens within the timeout.
    max_tokens: 512
    enabled: true
    file: "/home/john/llm-stack/models/gguf/qwen3-8b.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: true
    ttl_s: 0
    # CPU-only inference is memory-bandwidth-bound past ~8 threads on this
    # box (32 cores total). Uncapped, llama-server defaults to grabbing
    # most/all cores for the duration of a summary run, starving the CPU
    # side (sampling/tokenization/streaming) of concurrent GPU-backed
    # requests — observed as spurious swap_wait stalls on coder-small while
    # a summary was in flight (2026-08-11, traces a2cfae1f/a0e31fde) even
    # though ttl:0 kept it resident. Capping leaves headroom for the rest.
    extra_flags: ["--threads", "8"]
  - name: embed
    class: embed
    ctx: 2048
    gpu: cpu
    tool_call: none
    thinking: false
    reasoning_off: false
    max_tokens: 256
    enabled: true
    file: "/home/john/llm-stack/models/gguf/nomic-embed-text-v2-moe.Q4_K_M.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: true
    ttl_s: 0
    extra_flags: ["--threads", "4"]
  - name: classifier
    class: classifier
    ctx: 4096
    gpu: cpu
    tool_call: none
    thinking: false
    reasoning_off: true
    max_tokens: 64
    enabled: true
    file: "/home/john/llm-stack/models/gguf/Qwen3-1.7B-Q4_K_M.gguf"
    quant: Q4_K_M
    mmproj: null
    resident: true
    ttl_s: 0
    # 2026-08-15: switched from Q8_0 to Q4_K_M -- Q8_0's CPU decode floor
    # (~14.5 tok/s even fully warm/threaded, confirmed live) put every
    # routing call at 0.9-1s minimum regardless of thread count. Q4_K_M is
    # ~2x lighter per token on CPU. This is a routing-model change, so it's
    # gated on scripts/eval_router.py re-clearing the >=90% bar (PLAN.md
    # §Phase 2 exit criterion) before being trusted in production -- the
    # original Qwen3-1.7B-Q8_0.gguf file is left on disk for instant revert
    # if it doesn't.
    #
    # Live incident 2026-08-15 (trace 91017f4d, chat c33ddccd): capping this
    # to --threads 4 alongside utility/embed (same blanket contention fix,
    # no dedicated justification) turned every classifier call -- which
    # runs on the hot path for EVERY chat turn's routing, not just during a
    # rare concurrent summary -- into a 7-7.6s stall, ~7x the documented
    # 0.9-1.1s warm baseline (PLAN.md §4.1, phase0-measurements.md §12).
    # Unlike utility's summary generation (long-running, 1024 max_tokens,
    # 17-40s -- the actual documented contention source, config.yaml's
    # utility comment above), classifier's calls are brief (max_tokens=64,
    # ~1s even uncapped), so the contention window a higher thread count
    # risks is short. Latency-critical + brief >> throughput-capped here.
    extra_flags: ["--threads", "16"]

defaults:
  chat_model: "chat-default"
  utility_model: "utility"
  title_model: "dispatcher"

llm:
  # Must exceed a cold GPU0 swap + first-token latency. PLAN.md §4.1's
  # 12.47s benchmark undershoots live reality: a live trace (2026-08-11,
  # trace e14cbbe6) measured swap_wait alone at 28s for chat-default,
  # leaving ~2s of the old 30s budget for the model to actually respond --
  # hit first_token_timeout mid-conversation, stuck on a "loading
  # chat-default" banner. Matches the classifier timeout bump (6s->90s,
  # same live-cold-load-underestimate class of bug) earlier this session.
  first_token_timeout_s: 90

debug:
  store_prompts: true

# chat-default is re-warmed after this many minutes of GPU0 idle on another
# model — keeps warm 0.67s first-token vs cold 12.47s (PLAN.md §4.1).
# swap_yaml_path is the live, already-fixed llama-swap config (PLAN §4.1);
# swapgen writes it and llama-swap picks it up via its own -watch-config
# flag — there is no reload REST endpoint (verified live, llama-swap v237).
gpu:
  rewarm_default_after_min: 10
  enabled: true
  swap_yaml_path: /home/john/llm-stack/serving/llama-swap/config.yaml
  reload_on_change: true
  vram_guard: true

# Smart router: manual override → keyword rules → grammar-constrained
# classifier (PLAN.md §4.3). chit_chat intentionally routes to chat-default
# not utility — utility is CPU-resident and costs ~18-22s/short gen (Phase 0
# §8 Test 3). Titles go to dispatcher (0.042s, 8/8 rubric) not utility
# (43.5s, 1/8) — Phase 0 §12.
routing:
  rules:
    - keywords: ["write code", "stack trace"]
      intent: code_task
  attachments:
    image: vision_task
    code_file: code_task
  intents:
    chat: chat-default
    chit_chat: chat-default
    code_task: coder
    reasoning_task: reasoner
    vision_task: vision
    tool_call_needed: chat-default
  classifier:
    model: classifier
    # The real few-shot prompt is ~600 tokens and the classifier is CPU-
    # resident: measured 0.9-1.1s warm, 2.5s on a cold prompt cache (live,
    # 2026-08-02). The old 2.0s bound tripped on every cold call, so every
    # turn silently fell back to chat-default.
    timeout_s: 90.0
    confidence_threshold: 0.5
    fallback_model: chat-default

background:
  title_model: dispatcher
  summary_model: utility
  summary_every_n_turns: 6
