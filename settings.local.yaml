# Settings UI overrides only. Model defaults and performance flags belong in
# config.yaml; this file must not contain a copied full model roster.
models:
  chat-default:
    thinking: true
    reasoning_off: false
  reasoner:
    ctx: 131072
    file: /home/john/llm-stack/models/gguf/Qwen3.8-27B-UD-Q4_K_XL-reasoner.gguf
    extra_flags:
      - --reasoning
      - 'on'
      - --reasoning-preserve
      - --chat-template-kwargs
      - '''{"reasoning_effort":"medium"}'''
      - --reasoning-budget
      - '5000'
  reasoner-alt:
    enabled: true

routing:
  rules:
    - keywords: [write code, stack trace]
      intent: code_task
    - keywords: [think step by step]
      intent: reasoning_task
