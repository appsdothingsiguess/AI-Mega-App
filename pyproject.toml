[project]
name = "ai_mega_app"
version = "0.1.0"
description = "Personal AI platform: claude.ai-parity web UI backed by local models via llama.cpp/llama-swap."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "qdrant-client>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Phase-0 benchmark/eval tooling is a closed-phase artifact: one-off scripts,
# never imported by `app/`, kept in git as the provenance behind
# docs/phase0-measurements.md. Linting them costs ~256 findings of no value and
# blocks CI on frozen code. Deliberately narrow — `scripts/preflight.py`
# (live-hardware checks) and the Phase-2 `eval/` harness are NOT excluded and
# must stay clean. Reviving one of these for new work? Drop it from the list.
extend-exclude = [
    "scripts/bench_*.py",
    "scripts/eval_*.py",
    "scripts/eval_data",
    "scripts/needle_training",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
